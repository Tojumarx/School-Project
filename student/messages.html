<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Box</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar">
        <div class="brand-section">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <h1 class="brand-title">Supervisor Messages</h1>
        </div>
        <div class="user-badge" id="userDisplay">Profile...</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="dashboard.html">📝 Today's Entry</a></li>
            <li class="sidebar-item"><a href="history.html">📊 View Past Logs</a></li>
            <li class="sidebar-item active"><a href="messages.html">💬 Message Box</a></li>
            <li class="sidebar-item"><a href="settings.html">⚙️ Profile Settings</a></li>
            <li><hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;"></li>
            <li class="sidebar-item"><a href="#" onclick="logout()" style="color: var(--status-rejected);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-wrapper" id="contentArea">
        <div class="card">
            <h2 class="card-title">💬 Chat with Supervisor</h2>
            <div class="chat-container" id="chatStream"></div>
            <div style="display:flex; gap:12px;">
                <input type="text" id="msgText" placeholder="Type your reply here...">
                <button onclick="sendMessage()" class="btn btn-primary" style="width: auto; padding: 0 24px;">Send</button>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMG5U1xYwoKGj-h6niNA7A_pY7LMkAfSc",
            authDomain: "digital-siwes-logbook.firebaseapp.com",
            projectId: "digital-siwes-logbook",
            storageBucket: "digital-siwes-logbook.firebasestorage.app",
            messagingSenderId: "1035689630303",
            appId: "1:1035689630303:web:1417dff7221ee3499e99ea"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('userDisplay').innerText = `👤 ${user.displayName || user.email}`;
                listen();
            } else { window.location.href = "../index.html"; }
        });

        function sendMessage() {
            const user = auth.currentUser;
            const txt = document.getElementById('msgText').value.trim();
            if(!txt) return;

            db.collection('siwes_messages').add({
                sender: user.email,
                senderName: user.displayName || "Student",
                recipient: "SUPERVISOR",
                text: txt,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { document.getElementById('msgText').value = ""; });
        }

        function listen() {
            const user = auth.currentUser;
            db.collection('siwes_messages')
              .where('recipient', 'in', [user.email, 'ALL'])
              .orderBy('timestamp', 'asc')
              .onSnapshot(snap => {
                  const box = document.getElementById('chatStream');
                  let html = "";
                  snap.forEach(doc => {
                      const msg = doc.data();
                      const cls = msg.recipient === 'ALL' ? 'msg-general' : 'msg-private';
                      const lbl = msg.recipient === 'ALL' ? '📢 Broadcast Notice' : '🔒 Private Message';
                      html += `<div class="message-bubble ${cls}"><small style="display:block; font-weight:700; color:var(--primary-slate); margin-bottom:4px;">${lbl}</small><p>${msg.text}</p></div>`;
                  });
                  box.innerHTML = html;
                  box.scrollTop = box.scrollHeight;
              });
        }
        function toggleMenu() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('contentArea').classList.toggle('shifted');
        }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
