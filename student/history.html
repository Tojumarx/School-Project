<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Past Logs</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="brand-title">SIWES Past History</div>
        <div class="user-tag" id="userDisplay">Profile...</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">📝 Today's Entry</a></li>
            <li class="active"><a href="history.html">📊 View Past Logs</a></li>
            <li><a href="messages.html">💬 Message Box</a></li>
            <li><a href="settings.html">⚙️ Profile Settings</a></li>
            <li><hr style="border:0; border-top:1px solid #eee; margin:10px 0;"></li>
            <li><a href="#" onclick="logout()" style="color:var(--danger);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-container">
        <div class="card">
            <h2 class="card-title">Search Your Log History</h2>
            <div class="filter-row">
                <div class="form-group">
                    <label>From Date:</label>
                    <input type="date" id="start">
                </div>
                <div class="form-group">
                    <label>To Date:</label>
                    <input type="date" id="end">
                </div>
                <button onclick="fetchHistory('custom')" class="btn btn-primary" style="height:40px;">Search</button>
            </div>

            <div id="logsDisplay">
                <p style="text-align:center; color:#6b7280;">Use the parameters above to choose a date range.</p>
            </div>
        </div>
    </main>

    <script>
        // Use same config as index.html
        const firebaseConfig = { apiKey: "YOUR_API_KEY_HERE", authDomain: "YOUR_PROJECT_ID.firebaseapp.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT_ID.appspot.com", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('userDisplay').innerText = user.displayName || user.email;
                fetchHistory('all');
            } else { window.location.href = "../index.html"; }
        });

        function fetchHistory(mode) {
            const user = auth.currentUser;
            let query = db.collection('siwes_logs').where("email", "==", user.email);

            if (mode === 'custom') {
                const startVal = document.getElementById('start').value;
                const endVal = document.getElementById('end').value;
                if (!startVal || !endVal) return alert("Please fill both date fields.");

                const startTS = firebase.firestore.Timestamp.fromDate(new Date(startVal));
                const endDate = new Date(endVal); endDate.setHours(23,59,59);
                const endTS = firebase.firestore.Timestamp.fromDate(endDate);

                query = query.where("timestamp", ">=", startTS).where("timestamp", "<=", endTS);
            }

            query.orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const display = document.getElementById('logsDisplay');
                let html = "";
                if(snapshot.empty) { display.innerHTML = "<p style='text-align:center; color:#6b7280;'>No logs matching this range.</p>"; return; }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div style="border-bottom:1px solid #eee; padding:15px 0;">
                            <div style="display:flex; justify-content:between; align-items:center; width:100%;">
                                <strong style="color:var(--primary); flex:1;">${data.date}</strong>
                                <span class="badge badge-${data.status.toLowerCase()}">${data.status}</span>
                            </div>
                            <p style="margin-top:5px; color:#4b5563;">${data.activity}</p>
                        </div>`;
                });
                display.innerHTML = html;
            });
        }
        function toggleMenu() { document.getElementById('sidebarMenu').classList.toggle('open'); }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
