<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Past Logs</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar">
        <div class="brand-section">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <h1 class="brand-title">SIWES Past History</h1>
        </div>
        <div class="user-badge" id="userDisplay">Profile...</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="dashboard.html">📝 Today's Entry</a></li>
            <li class="sidebar-item active"><a href="history.html">📊 View Past Logs</a></li>
            <li class="sidebar-item"><a href="messages.html">💬 Message Box</a></li>
            <li class="sidebar-item"><a href="settings.html">⚙️ Profile Settings</a></li>
            <li><hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;"></li>
            <li class="sidebar-item"><a href="#" onclick="logout()" style="color: var(--status-rejected);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-wrapper" id="contentArea">
        <div class="card">
            <h2 class="card-title">📊 Filter Log History</h2>
            <div class="filter-row">
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="start">
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="end">
                </div>
                <button onclick="fetchHistory('custom')" class="btn btn-primary" style="height: 44px; width: auto; align-self: flex-end;">Apply Filter</button>
            </div>

            <div id="logsDisplay">
                <p style="text-align: center; color: #64748b; padding: 20px;">Use the parameters above to select a date range.</p>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMG5U1xYwoKGj-h6niNA7A_pY7LMkAfSc",
            authDomain: "digital-siwes-logbook.firebaseapp.com",
            projectId: "digital-siwes-logbook",
            storageBucket: "digital-siwes-logbook.firebasestorage.app",
            messagingSenderId: "1035689630303",
            appId: "1:1035689630303:web:1417dff7221ee3499e99ea"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('userDisplay').innerText = `👤 ${user.displayName || user.email}`;
                fetchHistory('all');
            } else { window.location.href = "../index.html"; }
        });

        function fetchHistory(mode) {
            const user = auth.currentUser;
            let query = db.collection('siwes_logs').where("email", "==", user.email);

            if (mode === 'custom') {
                const startVal = document.getElementById('start').value;
                const endVal = document.getElementById('end').value;
                if (!startVal || !endVal) return alert("Please fill both date fields.");

                const startTS = firebase.firestore.Timestamp.fromDate(new Date(startVal));
                const endDate = new Date(endVal); endDate.setHours(23,59,59);
                const endTS = firebase.firestore.Timestamp.fromDate(endDate);

                query = query.where("timestamp", ">=", startTS).where("timestamp", "<=", endTS);
            }

            query.orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const display = document.getElementById('logsDisplay');
                let html = "";
                if(snapshot.empty) { display.innerHTML = "<p style='text-align:center; color:#64748b; padding:20px;'>No logs matching this range.</p>"; return; }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div style="border-bottom:1px solid var(--border-color); padding: 20px 0; animation: scaleUp 0.3s ease;">
                            <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px;">
                                <strong style="color:var(--primary-slate); font-size:1.05rem;">🗓️ ${data.date}</strong>
                                <span class="status-badge status-${data.status}">${data.status}</span>
                            </div>
                            <p style="color:#475569; font-size:0.92rem; margin-bottom:12px;">${data.activity}</p>
                            ${data.photoProof ? `<a href="${data.photoProof}" target="_blank" style="font-size:0.8rem; color:var(--accent-sky); font-weight:700; text-decoration:none;">🖼️ Inspect Attachment</a>` : ''}
                        </div>`;
                });
                display.innerHTML = html;
            });
        }
        function toggleMenu() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('contentArea').classList.toggle('shifted');
        }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
