<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Today's Entry</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar">
        <div class="brand-section">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <h1 class="brand-title">SIWES Logbook</h1>
        </div>
        <div class="user-badge" id="userDisplay">Profile...</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li class="sidebar-item active"><a href="dashboard.html">📝 Today's Entry</a></li>
            <li class="sidebar-item"><a href="history.html">📊 View Past Logs</a></li>
            <li class="sidebar-item"><a href="messages.html">💬 Message Box</a></li>
            <li class="sidebar-item"><a href="settings.html">⚙️ Profile Settings</a></li>
            <li><hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;"></li>
            <li class="sidebar-item"><a href="#" onclick="logout()" style="color: var(--status-rejected);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-wrapper" id="contentArea">
        <div class="card">
            <h2 class="card-title">📝 Add Today's Log Entry</h2>
            <form id="logForm">
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label>Select Date</label>
                        <input type="date" id="logDate" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label>Photo Proof URL Link</label>
                        <input type="text" id="photoUrl" placeholder="Paste ImgBB link or postimage link here" required>
                    </div>
                </div>

                <input type="hidden" id="lat"><input type="hidden" id="lng">

                <div class="form-group">
                    <label>Description of Work Done Today</label>
                    <textarea id="activity" rows="5" placeholder="Write full details about your tasks, setups managed, or code architectures handled today..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-accent" style="width: auto; padding: 12px 30px;">Save Log Entry</button>
            </form>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMG5U1xYwoKGj-h6niNA7A_pY7LMkAfSc",
            authDomain: "digital-siwes-logbook.firebaseapp.com",
            projectId: "digital-siwes-logbook",
            storageBucket: "digital-siwes-logbook.firebasestorage.app",
            messagingSenderId: "1035689630303",
            appId: "1:1035689630303:web:1417dff7221ee3499e99ea"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('userDisplay').innerText = `👤 ${user.displayName || user.email}`;
            } else {
                window.location.href = "../index.html";
            }
        });

        window.addEventListener('load', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('lat').value = pos.coords.latitude;
                    document.getElementById('lng').value = pos.coords.longitude;
                }, err => console.warn("GPS Location block unavailable"), { enableHighAccuracy: true });
            }
        });

        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            const date = document.getElementById('logDate').value;
            const text = document.getElementById('activity').value.trim();
            const photoLink = document.getElementById('photoUrl').value.trim();
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;

            if(!lat || !lng) return alert("Please allow location tracking access to verify this log.");

            try {
                await db.collection('siwes_logs').add({
                    email: user.email,
                    studentName: user.displayName || "Student",
                    date: date,
                    activity: text,
                    photoProof: photoLink,
                    location: { lat: parseFloat(lat), lng: parseFloat(lng) },
                    status: "Pending",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Log saved successfully!");
                document.getElementById('logForm').reset();
            } catch (err) { alert(err.message); }
        });

        function toggleMenu() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('contentArea').classList.toggle('shifted');
        }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
