<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIWES Logbook - Portal Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body style="padding-top: 0; display: flex; align-items: center; justify-content: center; background: #e5e7eb;">

    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 5px; color: var(--primary);">SIWES Portal</h2>
        <p style="text-align: center; color: #6b7280; font-size: 0.9rem; margin-bottom: 25px;">Sign in to manage your logbook records</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="example@fupre.edu.ng">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then((credential) => {
                    const userEmail = credential.user.email.toLowerCase();
                    if (userEmail.includes('admin') || userEmail.includes('supervisor')) {
                        window.location.href = "supervisor/dashboard.html";
                    } else {
                        window.location.href = "student/dashboard.html";
                    }
                })
                .catch(err => alert("Login failed: " + err.message));
        });
    </script>
</body>
</html>
