<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review History Book</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar" style="background-color: var(--primary-slate);">
        <div class="brand-section">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <h1 class="brand-title">SIWES History Book</h1>
        </div>
        <div class="user-badge" style="border-color: var(--status-rejected); color: var(--status-rejected);">🛡️ EVALUATOR MODE</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="dashboard.html">📊 Review Pending Logs</a></li>
            <li class="sidebar-item"><a href="students.html">👥 Supervised Students</a></li>
            <li class="sidebar-item"><a href="broadcast.html">📤 Message Center</a></li>
            <li class="sidebar-item active"><a href="history.html">📜 Review History Book</a></li>
            <li><hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;"></li>
            <li class="sidebar-item"><a href="#" onclick="logout()" style="color: var(--status-rejected);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-wrapper" id="contentArea">
        <div class="card">
            <h3 class="card-title">📜 Filter Student Log Archives</h3>
            <div class="filter-row">
                <div class="form-group" style="flex:2;">
                    <label>Filter by Student Name or Email</label>
                    <input type="text" id="fSearchTerm" placeholder="Search student name or email...">
                </div>
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="fStart">
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="fEnd">
                </div>
                <button onclick="runArchiveSearch()" class="btn btn-primary" style="height:46px; width: auto; align-self: flex-end;">Search Archives</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Date</th>
                            <th>Work Done</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTable">
                        <tr><td colspan="4" style="text-align:center; color:#64748b; padding:20px;">Execute a search using the parameters above.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMG5U1xYwoKGj-h6niNA7A_pY7LMkAfSc",
            authDomain: "digital-siwes-logbook.firebaseapp.com",
            projectId: "digital-siwes-logbook",
            storageBucket: "digital-siwes-logbook.firebasestorage.app",
            messagingSenderId: "1035689630303",
            appId: "1:1035689630303:web:1417dff7221ee3499e99ea"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if(!user) window.location.href = "../index.html";
        });

        function runArchiveSearch() {
            const term = document.getElementById('fSearchTerm').value.toLowerCase().trim();
            const start = document.getElementById('fStart').value;
            const end = document.getElementById('fEnd').value;

            let query = db.collection('siwes_logs');
            
            if(start && end) {
                const sTS = firebase.firestore.Timestamp.fromDate(new Date(start));
                const eObj = new Date(end); eObj.setHours(23,59,59);
                const eTS = firebase.firestore.Timestamp.fromDate(eObj);
                query = query.where("timestamp", ">=", sTS).where("timestamp", "<=", eTS);
            }

            query.orderBy("timestamp", "desc").get().then(snap => {
                const tbody = document.getElementById('archiveTable'); tbody.innerHTML = "";
                if(snap.empty) { tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 20px;'>No matching records found.</td></tr>"; return; }
                
                let matchesCount = 0;
                snap.forEach(doc => {
                    const d = doc.data();
                    
                    // Match query concurrently against studentName and email keys
                    const nameMatch = d.studentName ? d.studentName.toLowerCase().includes(term) : false;
                    const emailMatch = d.email ? d.email.toLowerCase().includes(term) : false;
                    
                    if (term === "" || nameMatch || emailMatch) {
                        matchesCount++;
                        tbody.innerHTML += `
                            <tr style="animation: scaleUp 0.3s ease;">
                                <td data-label="Student"><b>👤 ${d.studentName}</b><br><small style="color: #64748b;">${d.email}</small></td>
                                <td data-label="Date" style="white-space:nowrap; font-weight:600;">${d.date}</td>
                                <td data-label="Work Done">${d.activity}</td>
                                <td data-label="Status"><span class="status-badge status-${d.status}">${d.status}</span></td>
                            </tr>`;
                    }
                });

                if (matchesCount === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 20px;'>No matching records found.</td></tr>";
                }
            }).catch(err => {
                alert("Make sure your Firestore indexes are built for this query pattern.");
                console.error(err);
            });
        }

        function toggleMenu() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('contentArea').classList.toggle('shifted');
        }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
