<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review History Book</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar" style="background:#111827;">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="brand-title">SIWES History Book</div>
        <div class="user-tag" style="background:#dc2626;">Supervisor Mode</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">📊 Review Pending Logs</a></li>
            <li><a href="broadcast.html">📤 Message Center</a></li>
            <li class="active"><a href="history.html">📜 Review History Book</a></li>
            <li><hr style="border:0; border-top:1px solid #eee; margin:10px 0;"></li>
            <li><a href="#" onclick="logout()" style="color:var(--danger);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-container">
        <div class="card">
            <h3 class="card-title">Filter Log Archives</h3>
            <div class="filter-row">
                <div class="form-group" style="flex:2;">
                    <label>Filter by Student Email</label>
                    <input type="email" id="fEmail" placeholder="student@fupre.edu.ng">
                </div>
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="fStart">
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="fEnd">
                </div>
                <button onclick="runArchiveSearch()" class="btn btn-primary" style="height:40px;">Search</button>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Date</th>
                            <th>Work Done</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTable"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "YOUR_API_KEY_HERE", authDomain: "YOUR_PROJECT_ID.firebaseapp.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT_ID.appspot.com", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if(!user) window.location.href = "../index.html";
        });

        function runArchiveSearch() {
            const email = document.getElementById('fEmail').value.trim();
            const start = document.getElementById('fStart').value;
            const end = document.getElementById('fEnd').value;

            let query = db.collection('siwes_logs');

            if(email) query = query.where("email", "==", email);
            
            if(start && end) {
                const sTS = firebase.firestore.Timestamp.fromDate(new Date(start));
                const eObj = new Date(end); eObj.setHours(23,59,59);
                const eTS = firebase.firestore.Timestamp.fromDate(eObj);
                query = query.where("timestamp", ">=", sTS).where("timestamp", "<=", eTS);
            }

            query.orderBy("timestamp", "desc").get().then(snap => {
                const tbody = document.getElementById('archiveTable'); tbody.innerHTML = "";
                if(snap.empty) { tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No matching records found.</td></tr>"; return; }
                
                snap.forEach(doc => {
                    const d = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td data-label="Student"><b>${d.studentName}</b><br><small>${d.email}</small></td>
                            <td data-label="Date">${d.date}</td>
                            <td data-label="Work Done">${d.activity}</td>
                            <td data-label="Status"><span class="badge badge-${d.status.toLowerCase()}">${d.status}</span></td>
                        </tr>`;
                });
            }).catch(err => alert("Make sure your Firestore indexes are built for this query pattern."));
        }

        function toggleMenu() { document.getElementById('sidebarMenu').classList.toggle('open'); }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
