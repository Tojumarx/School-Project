<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Center</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar" style="background-color: var(--primary-slate);">
        <div class="brand-section">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <h1 class="brand-title">SIWES Message Center</h1>
        </div>
        <div class="user-badge" style="border-color: var(--status-rejected); color: var(--status-rejected);">🛡️ EVALUATOR MODE</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="dashboard.html">📊 Review Pending Logs</a></li>
            <li class="sidebar-item active"><a href="broadcast.html">📤 Message Center</a></li>
            <li class="sidebar-item"><a href="history.html">📜 Review History Book</a></li>
            <li><hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 15px 0;"></li>
            <li class="sidebar-item"><a href="#" onclick="logout()" style="color: var(--status-rejected);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-wrapper" id="contentArea">
        <div style="display:flex; gap:30px; flex-wrap:wrap;">
            
            <div class="card" style="flex:1.2; min-width:320px;">
                <h3 class="card-title">📥 Incoming Inquiries</h3>
                <div class="chat-container" id="studentMailStream"></div>
            </div>

            <div class="card" style="flex:1; min-width:300px;">
                <h3 class="card-title">📤 Send a Message</h3>
                <div class="form-group">
                    <label>Audience Target</label>
                    <select id="scope" onchange="document.getElementById('targetBox').style.display = this.value==='ALL'?'none':'block'">
                        <option value="ALL">📢 General Broadcast Notification (All Students)</option>
                        <option value="DIRECT">🔒 Private Direct Note (Single Student)</option>
                    </select>
                </div>
                <div class="form-group" id="targetBox" style="display:none;">
                    <label>Target Student Email</label>
                    <input type="email" id="targetEmail" placeholder="student@fupre.edu.ng">
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea id="msgBody" rows="4" placeholder="Write announcements, log update notices, or specific feedback here..."></textarea>
                </div>
                <button onclick="dispatch()" class="btn btn-primary" style="width:100%;">Deploy Message</button>
            </div>

        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMG5U1xYwoKGj-h6niNA7A_pY7LMkAfSc",
            authDomain: "digital-siwes-logbook.firebaseapp.com",
            projectId: "digital-siwes-logbook",
            storageBucket: "digital-siwes-logbook.firebasestorage.app",
            messagingSenderId: "1035689630303",
            appId: "1:1035689630303:web:1417dff7221ee3499e99ea"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if(user) { listenMail(); } else { window.location.href="../index.html"; }
        });

        function dispatch() {
            const scope = document.getElementById('scope').value;
            const target = document.getElementById('targetEmail').value.trim();
            const text = document.getElementById('msgBody').value.trim();
            if(!text) return;

            db.collection('siwes_messages').add({
                sender: "SUPERVISOR",
                senderName: "Supervisor",
                recipient: scope === 'ALL' ? 'ALL' : target,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Message deployed successfully!");
                document.getElementById('msgBody').value = "";
                document.getElementById('targetEmail').value = "";
            });
        }

        function listenMail() {
            db.collection('siwes_messages').where('recipient', '==', 'SUPERVISOR').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const stream = document.getElementById('studentMailStream'); stream.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    stream.innerHTML += `
                        <div class="message-bubble msg-student-sent" style="width:100%; animation: scaleUp 0.3s ease;">
                            <b>From: ${m.senderName}</b> (<small>${m.sender}</small>)
                            <p style="margin:8px 0; background:#f8fafc; padding:10px; border-radius:6px; border: 1px solid var(--border-color); color: #334155;">${m.text}</p>
                            <button onclick="replyShortcut('${m.sender}')" class="btn btn-primary" style="padding: 4px 12px; font-size:11px; width:auto; border-radius: 4px;">Reply</button>
                        </div>`;
                });
            });
        }

        function replyShortcut(email) {
            document.getElementById('scope').value = 'DIRECT';
            document.getElementById('targetBox').style.display = 'block';
            document.getElementById('targetEmail').value = email;
            document.getElementById('msgBody').focus();
        }
        function toggleMenu() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('contentArea').classList.toggle('shifted');
        }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
