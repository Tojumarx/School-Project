<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Center</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar" style="background:#111827;">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="brand-title">SIWES Message Center</div>
        <div class="user-tag" style="background:#dc2626;">Supervisor Mode</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">📊 Review Pending Logs</a></li>
            <li class="active"><a href="broadcast.html">📤 Message Center</a></li>
            <li><a href="history.html">📜 Review History Book</a></li>
            <li><hr style="border:0; border-top:1px solid #eee; margin:10px 0;"></li>
            <li><a href="#" onclick="logout()" style="color:var(--danger);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-container" style="max-width:1100px;">
        <div style="display:flex; gap:20px; flex-wrap:wrap;">
            
            <div class="card" style="flex:1; min-width:300px;">
                <h3 class="card-title">Incoming Student Messages</h3>
                <div class="chat-box" id="studentMailStream"></div>
            </div>

            <div class="card" style="flex:1; min-width:300px;">
                <h3 class="card-title">Send a Message</h3>
                <div class="form-group">
                    <label>Audience Target</label>
                    <select id="scope" onchange="document.getElementById('targetBox').style.display = this.value==='ALL'?'none':'block'">
                        <option value="ALL">Broadcast to All Registered Students</option>
                        <option value="DIRECT">Send to Specific Student Only</option>
                    </select>
                </div>
                <div class="form-group" id="targetBox" style="display:none;">
                    <label>Target Student Email</label>
                    <input type="email" id="targetEmail" placeholder="student@fupre.edu.ng">
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea id="msgBody" rows="4" placeholder="Write announcement details or feedback here..."></textarea>
                </div>
                <button onclick="dispatch()" class="btn btn-primary" style="width:100%;">Send Message</button>
            </div>

        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "YOUR_API_KEY_HERE", authDomain: "YOUR_PROJECT_ID.firebaseapp.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT_ID.appspot.com", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if(user) { listenMail(); } else { window.location.href="../index.html"; }
        });

        function dispatch() {
            const scope = document.getElementById('scope').value;
            const target = document.getElementById('targetEmail').value.trim();
            const text = document.getElementById('msgBody').value.trim();
            if(!text) return;

            db.collection('siwes_messages').add({
                sender: "SUPERVISOR",
                senderName: "Supervisor",
                recipient: scope === 'ALL' ? 'ALL' : target,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Message sent!");
                document.getElementById('msgBody').value = "";
                document.getElementById('targetEmail').value = "";
            });
        }

        function listenMail() {
            db.collection('siwes_messages').where('recipient', '==', 'SUPERVISOR').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const stream = document.getElementById('studentMailStream'); stream.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    stream.innerHTML += `
                        <div class="msg msg-outbound" style="width:100%;">
                            <b>From: ${m.senderName}</b> (<small>${m.sender}</small>)
                            <p style="margin:5px 0; background:#f3f4f6; padding:8px; border-radius:4px;">${m.text}</p>
                            <button onclick="replyShortcut('${m.sender}')" style="background:var(--primary);color:white;border:none;padding:3px 6px;border-radius:3px;font-size:11px;cursor:pointer;">Reply</button>
                        </div>`;
                });
            });
        }

        function replyShortcut(email) {
            document.getElementById('scope').value = 'DIRECT';
            document.getElementById('targetBox').style.display = 'block';
            document.getElementById('targetEmail').value = email;
            document.getElementById('msgBody').focus();
        }
        function toggleMenu() { document.getElementById('sidebarMenu').classList.toggle('open'); }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
