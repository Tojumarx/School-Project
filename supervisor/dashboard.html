<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Control Center</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-navbar" style="background:#111827;">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="brand-title">SIWES Supervisor Desk</div>
        <div class="user-tag" style="background:#dc2626;">Supervisor Mode</div>
    </nav>

    <aside class="sidebar" id="sidebarMenu">
        <ul class="sidebar-menu">
            <li class="active"><a href="dashboard.html">📊 Review Pending Logs</a></li>
            <li><a href="broadcast.html">📤 Message Center</a></li>
            <li><a href="history.html">📜 Review History Book</a></li>
            <li><hr style="border:0; border-top:1px solid #eee; margin:10px 0;"></li>
            <li><a href="#" onclick="logout()" style="color:var(--danger);">🚪 Log Out</a></li>
        </ul>
    </aside>

    <main class="main-container">
        <div class="card">
            <h3 class="card-title">Register New Student Account</h3>
            <form id="addStudentForm" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
                <div class="form-group" style="flex:1; min-width:180px; margin-bottom:0;">
                    <label>Student Email</label>
                    <input type="email" id="newEmail" required placeholder="name@fupre.edu.ng">
                </div>
                <div class="form-group" style="flex:1; min-width:150px; margin-bottom:0;">
                    <label>Temporary Password</label>
                    <input type="password" id="newPass" required placeholder="Minimum 6 chars">
                </div>
                <button type="submit" class="btn btn-accent" style="height:40px;">Create Account</button>
            </form>
        </div>

        <div class="card">
            <h3 class="card-title">Unreviewed Logs Stream</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Date</th>
                            <th>Description of Work</th>
                            <th>Location / Photo</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "YOUR_API_KEY_HERE", authDomain: "YOUR_PROJECT_ID.firebaseapp.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT_ID.appspot.com", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (!user || (!user.email.toLowerCase().includes('admin') && !user.email.toLowerCase().includes('supervisor'))) {
                window.location.href = "../index.html";
            } else { listenLogs(); }
        });

        // Handler to add a student account programmatically from the portal
        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('newEmail').value.trim();
            const pass = document.getElementById('newPass').value;

            // Secondary initialization instance wrapper avoids breaking existing current session
            let secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryInstance");
            secondaryApp.auth().createUserWithEmailAndPassword(email, pass).then((res) => {
                alert(`Account successfully created for ${email}!`);
                document.getElementById('addStudentForm').reset();
                secondaryApp.delete();
            }).catch(err => alert("Error provisioning profile: " + err.message));
        });

        function listenLogs() {
            db.collection('siwes_logs').where("status", "==", "Pending").orderBy("timestamp", "desc").onSnapshot(snap => {
                const tbody = document.getElementById('logTable'); tbody.innerHTML = "";
                if(snap.empty) { tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;color:#6b7280;'>No logs waiting evaluation.</td></tr>"; return; }
                
                snap.forEach(doc => {
                    const d = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td data-label="Student"><b>${d.studentName}</b><br><small>${d.email}</small></td>
                            <td data-label="Date" style="white-space:nowrap;">${d.date}</td>
                            <td data-label="Description of Work">${d.activity}</td>
                            <td data-label="Location / Photo">
                                <a href="https://maps.google.com/?q=${d.location.lat},${d.location.lng}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:bold;">📍 View Map</a><br>
                                <a href="${d.photoProof}" target="_blank" style="font-size:11px;color:var(--primary);">🖼️ View Photo</a>
                            </td>
                            <td data-label="Action">
                                <button onclick="approve('${doc.id}')" class="btn btn-accent" style="padding:4px 8px; font-size:12px;">Approve</button>
                            </td>
                        </tr>`;
                });
            });
        }

        function approve(id) { db.collection('siwes_logs').doc(id).update({ status: "Approved" }); }
        function toggleMenu() { document.getElementById('sidebarMenu').classList.toggle('open'); }
        function logout() { auth.signOut().then(() => window.location.href = "../index.html"); }
    </script>
</body>
</html>
